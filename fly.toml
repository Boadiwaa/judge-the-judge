# fly.io config for Judge the Judge. Clinical review completed 2026-10-29; first deployed the same day.
app = "judge-the-judge"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RATINGS_DB = "/data/ratings.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays running so a shared link never waits for a cold start (D-35); it still runs exactly one.
  min_machines_running = 1
  # Flet keeps each visitor's session in memory over a WebSocket, so run exactly ONE machine
  # (see DEPLOY.md: `fly scale count 1`).
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Volume created 2026-10-29 (`fly volumes create jtj_data --size 1 --region lhr`): clinician ratings and
# anonymous usage counts persist across deploys and machine restarts.
[mounts]
  source = "jtj_data"
  destination = "/data"
